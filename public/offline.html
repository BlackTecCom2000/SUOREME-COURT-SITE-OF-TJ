<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sud.tj — нет соединения</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: linear-gradient(160deg, #050d1f 0%, #0b1a30 60%, #05080f 100%);
        color: #f1f5f9;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }
      .card {
        max-width: 46ch;
        padding: 2rem;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p { margin: 0 0 1.5rem; color: #cbd5e1; font-size: 0.9375rem; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 16px;
        background: rgba(212, 164, 45, 0.18);
        border: 1px solid rgba(212, 164, 45, 0.5);
        color: #f7ecd0;
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 600;
      }
      a:hover { background: rgba(212, 164, 45, 0.28); }
      a:focus-visible { outline: 2px solid #d4a42d; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Нет соединения с сервером</h1>
      <p>
        Страница сохранена на этом устройстве, но свежие данные суда сейчас недоступны.
        Повторите попытку — как только соединение восстановится, данные обновятся
        автоматически.
      </p>
      <a href="/">Повторить</a>
    </div>
  </body>
</html>
