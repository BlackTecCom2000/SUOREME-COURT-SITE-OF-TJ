<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Верховный суд Республики Таджикистан — Судебная власть</title>
    <meta name="description" content="Официальный портал Верховного суда Республики Таджикистан. Осуществление судебной власти, защита прав и свобод человека, электронное правосудие." />
    <!--
      Fonts are self-hosted via @fontsource (Inter 300-700, Cormorant Garamond
      400/600/700 + italics incl. Cyrillic) and imported by entry-client, so
      they bundle into /assets and work offline. The previous Google Fonts
      CDN link hung on networks that cannot reach fonts.gstatic.com, blocking
      first paint; the preconnects went with it. Local fallbacks in tokens.css
      still cover a slow font load.
    -->
    <!-- Sets the saved theme before first paint. Served from /theme-bootstrap.js
         rather than inline because production CSP is script-src 'self' with no
         unsafe-inline, which silently blocked the inline version. Synchronous and
         without defer, so it still runs before the body is painted. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
